<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Modern Agenda — TypeScript</title>

  <link rel="stylesheet" href="../css/agenda.css">
  <link rel="stylesheet" href="../css/navigation.css">
</head>

<body>

  <main class="page">
    <section
      id="agenda"
      class="agenda stack"
      aria-labelledby="agenda-title"
    >

      <header class="agenda-header cluster">
        <div class="stack stack--tight">
          <p class="label">Conference Program</p>

          <h1 id="agenda-title">
            Modern Agenda
          </h1>

          <p class="meta">
            North Harbor Conference Center · October 17–20, 2026
          </p>
        </div>

        <p class="notice">
          Agenda is subject to change.
        </p>

        <nav class="site-nav" aria-label="Project navigation">
          <a class="nav-link" href="https://susanndelgado.github.io/Modern-Agenda-Rosetta-Stone/">Return to Index</a>
          <a class="nav-link" href="https://susanndelgado.github.io/Rosetta-Stone/">Return to Rosetta Stone</a>
          <a class="nav-link" href="https://sandbox.sdelgado.com/">Return to Sandbox</a>
        </nav>
      </header>

      <div id="agenda-days"></div>

      <p class="notice notice--footer">
        ** Agenda is subject to change.
      </p>

    </section>
  </main>

  <script src="agenda.js"></script>

</body>
</html>
