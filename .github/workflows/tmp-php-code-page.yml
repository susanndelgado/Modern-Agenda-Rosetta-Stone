name: Temporary PHP code page

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'Temporary PHP code page workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build PHP source page
        run: |
          python - <<'PY'
          from pathlib import Path
          import html

          source_path = Path('php/index.php')
          source = source_path.read_text()

          Path('php/phpAgenda.php').write_text(source)
          escaped = html.escape(source, quote=False)

          page = f'''<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modern Agenda — PHP Source</title>
  <meta name="description" content="PHP source code for the Modern Agenda Rosetta Stone implementation.">
  <link rel="stylesheet" href="https://susanndelgado.github.io/Rosetta-Stone/rosetta-docs.css">
  <link rel="stylesheet" href="../css/agenda.css">
</head>
<body>
  <main class="page">
    <section class="agenda stack" aria-labelledby="page-title">
      <header class="site-header cluster">
        <div class="stack stack--tight">
          <p class="label">Modern Agenda · Rosetta Stone</p>
          <h1 class="title-xl" id="page-title">PHP Source</h1>
          <p class="meta">Static code view of the PHP implementation used by Modern Agenda.</p>
        </div>

        <nav class="site-nav" aria-label="System links">
          <a class="nav-link" href="https://susanndelgado.github.io/Modern-Agenda-Rosetta-Stone/">Return to Modern Agenda</a>
          <a class="nav-link" href="https://susanndelgado.github.io/Rosetta-Stone/">Rosetta Stone System</a>
          <a class="nav-link" href="https://sdelgado.com/">Portfolio</a>
          <a class="nav-link" href="https://sandbox.sdelgado.com/">Developer Sandbox</a>
        </nav>
      </header>

      <article class="panel glass section stack">
        <header class="section-heading stack stack--tight">
          <p class="label">PHP</p>
          <h2 class="title-md">phpAgenda.php</h2>
          <p class="meta">GitHub Pages cannot execute PHP, so this page displays the implementation source directly.</p>
        </header>

        <pre class="panel glass"><code>{escaped}</code></pre>
      </article>
    </section>
  </main>
</body>
</html>
'''
          Path('php/index.html').write_text(page)

          root = Path('index.html')
          root_html = root.read_text()
          root_html = root_html.replace('href="php/index.php"', 'href="php/index.html"')
          root_html = root_html.replace(
              '<strong>Note:</strong> The PHP version cannot run directly on GitHub Pages.',
              '<strong>Note:</strong> GitHub Pages cannot execute PHP, so this link opens the PHP source code.'
          )
          root.write_text(root_html)
          source_path.unlink()

          assert Path('php/phpAgenda.php').read_text() == source
          assert 'href="php/index.html"' in root_html
          assert '&lt;?php' in page
          PY

      - name: Commit finished files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html php/index.html php/phpAgenda.php
          git rm php/index.php
          git commit -m "Create PHP source code page"
          git push
